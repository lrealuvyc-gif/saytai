<!doctype html>
<html lang="uz-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>gulhayo.ai Master AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;700&display=swap">
<style>
/* Layout: fixed stage (colour glow → scrolling text → WebGL phones on top, click-through). Scroll drives the chosen phone through scenes; its screen changes per scene. */
:root{
  --ink:#07070a;
  --fg:#f3f2f7;
  --muted:#9a98a8;
  --line:rgba(243,242,247,.14);
  --card:rgba(18,17,24,.72);
  --flavor-rgb:139 92 255;
  --display:"Unbounded","Arial Black",Impact,sans-serif;
  --body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  --gx:50%; --gy:45%; --glow:.8; --beams:0;
  --gut-l:max(20px, env(safe-area-inset-left, 0px));
  --gut-r:max(20px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
html{background:var(--ink)}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid rgb(var(--flavor-rgb));outline-offset:3px;border-radius:6px}

/* ---------- stage ---------- */
.stage{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.stage .glow{position:absolute;inset:-15%;opacity:var(--glow);
  background:radial-gradient(34% 40% at var(--gx) var(--gy), rgb(var(--flavor-rgb)/.6), rgb(var(--flavor-rgb)/.15) 48%, transparent 74%)}
.stage .beams{position:absolute;inset:0;opacity:var(--beams);filter:blur(18px);
  background:
    conic-gradient(from 180deg at 50% -12%, transparent 0 150deg, rgb(var(--flavor-rgb)/.45) 158deg, transparent 166deg 174deg, rgb(var(--flavor-rgb)/.5) 180deg, transparent 186deg 194deg, rgb(var(--flavor-rgb)/.45) 202deg, transparent 210deg),
    radial-gradient(70% 55% at 50% 52%, rgb(var(--flavor-rgb)/.72), transparent 72%)}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:46%;
  background:linear-gradient(to bottom, transparent, rgba(150,146,170,.07) 50%, rgba(150,146,170,.15))}
.stage .vig{position:absolute;inset:0;background:radial-gradient(130% 95% at 50% 45%, transparent 52%, rgba(0,0,0,.72))}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;opacity:0;transition:opacity 1s ease}
#gl.ready{opacity:1}
main,footer{position:relative;z-index:1}

/* ---------- header ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:calc(14px + env(safe-area-inset-top, 0px)) var(--gut-r) 12px var(--gut-l)}
.top .tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.logo{display:flex;align-items:baseline;text-decoration:none;font:800 19px/1 var(--display);letter-spacing:-.01em}
.logo em{font-style:normal;color:rgb(var(--flavor-rgb))}
.top-r{justify-self:end;display:flex;align-items:center;gap:14px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;cursor:pointer;font:700 11px/1 var(--display);letter-spacing:.06em;padding:7px 10px;border-radius:999px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.menu-btn{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:8px 0}
.menu-btn i{display:grid;grid-template-columns:4px 4px;gap:3px}
.menu-btn i b{width:4px;height:4px;border-radius:50%;background:currentColor}

.menu{position:fixed;inset:0;z-index:8;background:rgba(7,7,10,.94);backdrop-filter:blur(12px);display:grid;align-content:center;
  padding:calc(80px + env(safe-area-inset-top, 0px)) var(--gut-r) 40px var(--gut-l)}
.menu ul{list-style:none;margin:0 auto;padding:0;display:grid;gap:6px;width:min(100%,720px)}
.menu a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;text-decoration:none;padding:14px 0;border-bottom:1px solid var(--line);
  font:700 clamp(24px,5vw,46px)/1.05 var(--display);text-transform:uppercase}
.menu a small{font:500 12px var(--body);letter-spacing:.14em;color:var(--muted)}
.menu a:hover{color:rgb(var(--flavor-rgb))}
.menu .close{position:absolute;top:calc(14px + env(safe-area-inset-top, 0px));right:var(--gut-r);background:none;border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;cursor:pointer;font-size:12px;letter-spacing:.14em;text-transform:uppercase}

/* ---------- shared type ---------- */
.eyebrow{display:flex;align-items:center;gap:10px;margin:0;font:500 12px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:rgb(var(--flavor-rgb));box-shadow:0 0 12px rgb(var(--flavor-rgb))}
.big{margin:0;font:800 clamp(36px,5.2vw,80px)/.98 var(--display);text-transform:uppercase;letter-spacing:-.02em;text-wrap:balance}
.mid{margin:0;font:800 clamp(26px,3.4vw,48px)/1.02 var(--display);text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance}
.inner{width:100%;max-width:1280px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
p{margin:0}

/* ---------- hero ---------- */
.hero{position:relative;height:100vh;min-height:560px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.hero:active{cursor:grabbing}
.hero-intro{position:absolute;left:var(--gut-l);top:calc(84px + env(safe-area-inset-top, 0px));max-width:17rem;display:grid;gap:8px}
.hero-intro b{font:800 15px/1.2 var(--display);text-transform:uppercase}
.hero-intro span{font-size:13px;color:var(--muted)}
.hero-ui{position:absolute;left:0;right:0;top:74%;display:grid;justify-items:center;gap:16px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.hero-row{display:flex;align-items:center;gap:clamp(16px,4vw,48px)}
.hero-name{display:grid;justify-items:center;gap:8px;text-align:center;min-width:12ch}
.hero-name h1{margin:0;font:800 clamp(20px,2.2vw,28px)/1 var(--display);text-transform:uppercase;letter-spacing:-.01em;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.hero-name h1.swap{animation:swap .5s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.arrow{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(12,11,16,.45);backdrop-filter:blur(6px);cursor:pointer;
  display:grid;place-items:center;transition:border-color .2s, background .2s}
.arrow:hover{border-color:rgb(var(--flavor-rgb));background:rgb(var(--flavor-rgb)/.15)}
.arrow svg{width:18px;height:18px}
.track{position:relative;width:min(340px,70vw);height:3px;border-radius:3px;
  background:linear-gradient(90deg,#8b5cff,#ff4fa3,#ff8a3d,#3ddc97,#ffd23f,#4cc9ff);opacity:.9}
.track .thumb{position:absolute;top:-4px;width:16.666%;height:11px;border-radius:6px;background:var(--fg);box-shadow:0 0 14px rgb(var(--flavor-rgb))}
.hint{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:10px;white-space:nowrap}
.hint::after{content:"";width:1px;height:22px;background:linear-gradient(var(--muted),transparent)}

/* ---------- scroll scenes ---------- */
.scene{min-height:100vh;display:flex;align-items:center;padding-block:110px}
.panel{max-width:33rem;display:grid;gap:20px;text-shadow:0 1px 18px rgba(0,0,0,.55)}
.panel .lead{font-size:18px;color:rgba(243,242,247,.86);max-width:30rem}
.chips{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;background:rgba(12,11,16,.4);backdrop-filter:blur(6px)}
.stat{display:flex;align-items:baseline;gap:12px;padding-top:18px;border-top:1px solid var(--line)}
.stat b{font:800 clamp(26px,3vw,40px)/1 var(--display);color:rgb(var(--flavor-rgb))}
.stat span{font-size:14px;color:var(--muted)}

.slogan{position:relative;height:115vh;display:grid;place-items:center;text-align:center;overflow:hidden}
.slogan h2{margin:0;display:grid;font:800 clamp(44px,11vw,170px)/.9 var(--display);text-transform:uppercase;letter-spacing:-.03em;
  color:rgb(var(--flavor-rgb));text-shadow:0 0 70px rgb(var(--flavor-rgb)/.55);opacity:.92}
.slogan h2 span:last-child{color:transparent;-webkit-text-stroke:2px rgb(var(--flavor-rgb))}
.slogan p{position:absolute;left:0;right:0;bottom:16vh;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:rgba(243,242,247,.8);
  padding-left:var(--gut-l);padding-right:var(--gut-r)}

.lineup{position:relative;height:100vh;overflow:hidden}
.lineup-head{position:absolute;top:calc(9vh + 40px);left:0;right:0;display:grid;justify-items:center;gap:12px;text-align:center;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.lineup-head .eyebrow{justify-content:center}
#labels{position:absolute;inset:0}
.lbl{position:absolute;left:0;top:0;transform:translateX(-50%);display:grid;justify-items:center;gap:5px;background:none;border:0;cursor:pointer;padding:8px 10px;border-radius:10px;
  transition:background .2s;text-align:center}
.lbl:hover{background:rgba(255,255,255,.06)}
.lbl .lv{font:700 10px/1 var(--display);letter-spacing:.06em;padding:4px 7px;border-radius:999px;border:1px solid var(--c);color:var(--c)}
.lbl b{font:700 12px/1.15 var(--display);text-transform:uppercase}
.lbl[aria-pressed="true"] b{color:var(--c)}

.levels .inner{display:grid;gap:28px;padding-block:18vh 6vh}
.lv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.lv-card{border:1px solid var(--line);border-radius:24px;padding:clamp(22px,3vw,36px);background:var(--card);backdrop-filter:blur(10px);display:grid;gap:18px;align-content:start}
.lv-card header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.lv-card h3{margin:0;font:800 clamp(28px,3.4vw,46px)/1 var(--display)}
.lv-card .tagline{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lv-card ul{list-style:none;margin:0;padding:0;display:grid}
.lv-card li{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:16px}
.lv-card li::before{content:"";flex:none;width:7px;height:7px;margin-top:9px;border-radius:50%;background:var(--accent)}
.lv-card.a{--accent:#8b5cff}
.lv-card.b{--accent:#ffd23f}
.lv-card .now{color:var(--accent);font-weight:700}
.soon{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line);border-radius:20px;padding:18px 22px}
.soon b{font:700 14px/1.2 var(--display);text-transform:uppercase}
.soon span{color:var(--muted);font-size:14px;flex:1;min-width:14rem}
.soon i{font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:#4cc9ff;color:#07070a;font-weight:700}

.faq .inner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:clamp(32px,6vw,96px);padding-block:14vh 12vh;align-items:start}
.faq .big{position:sticky;top:120px}
details{border-top:1px solid var(--line);padding:22px 0}
details:last-child{border-bottom:1px solid var(--line)}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:20px;font:500 19px/1.35 var(--body)}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";flex:none;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;
  font:700 18px/1 var(--display);color:rgb(var(--flavor-rgb));transition:transform .3s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding-top:12px;color:rgba(243,242,247,.78);max-width:60ch}

.join .inner{display:grid;justify-items:center;text-align:center;gap:22px;padding-block:14vh 16vh}
.join .lead{max-width:34rem;color:rgba(243,242,247,.8);font-size:17px}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;border-radius:999px;padding:15px 26px;font-weight:700;font-size:15px;border:1px solid var(--line);transition:transform .2s, background .2s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:rgb(var(--flavor-rgb));color:#07070a;border-color:transparent}
.btn svg{width:18px;height:18px}
.handle{font:700 13px var(--display);letter-spacing:.04em;color:var(--muted);user-select:all}

footer{border-top:1px solid var(--line);background:rgba(7,7,10,.85)}
footer .inner{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:end;padding-block:48px calc(36px + env(safe-area-inset-bottom, 0px))}
.foot-mark{font:800 clamp(40px,7vw,96px)/.9 var(--display);letter-spacing:-.03em;color:transparent;-webkit-text-stroke:1.5px rgba(243,242,247,.5)}
footer nav{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px}
footer nav a{text-decoration:none;color:var(--muted)}
footer nav a:hover{color:var(--fg)}
footer .note{font-size:12px;color:#6f6d7c;max-width:30ch;text-align:right}

@media (max-aspect-ratio: 9/10){
  .top .tag{visibility:hidden}
  .hero-intro{display:none}
  .scene{align-items:flex-end;padding-block:0 calc(7vh + env(safe-area-inset-bottom, 0px))}
  .panel{max-width:none;gap:14px}
  .panel .lead{font-size:16px}
  .big{font-size:clamp(30px,8.6vw,56px)}
  .mid{font-size:clamp(22px,6.4vw,36px)}
}
@media (max-width:640px){
  .top{grid-template-columns:auto 1fr}
  .top .tag{display:none}
  .menu-btn span{display:none}
}
@media (max-width:820px){
  .lv-grid{grid-template-columns:1fr}
  .faq .inner{grid-template-columns:1fr}
  .faq .big{position:static}
  footer .inner{grid-template-columns:1fr;align-items:start}
  footer .note{text-align:left}
}
.nogl .hero-ui{top:auto;bottom:16vh}
.nogl #labels{position:absolute;inset:auto 0 18vh;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.nogl .lbl{position:static;transform:none}
@media (prefers-reduced-motion: reduce){ .hero-name h1.swap{animation:none} #gl{transition:none} .btn:hover{transform:none} }
</style>
</head>
<body>
<div class="stage" aria-hidden="true"><div class="glow"></div><div class="beams"></div><div class="floor"></div><div class="vig"></div></div>
<canvas id="gl" aria-hidden="true"></canvas>

<header class="top">
  <p class="tag" data-i18n="tag"></p>
  <a class="logo" href="#top" data-go="top" data-i18n-aria="logoA">gulhayo<em>.ai</em></a>
  <div class="top-r">
    <div class="lang" role="group" aria-label="Язык / Тил">
      <button type="button" data-lang="uz" aria-pressed="true">UZ</button>
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
    </div>
    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="menu" data-i18n-aria="menu"><i aria-hidden="true"><b></b><b></b><b></b><b></b></i><span data-i18n="menu"></span></button>
  </div>
</header>

<nav class="menu" id="menu" hidden data-i18n-aria="sections">
  <button class="close" id="menuClose" type="button" data-i18n="close"></button>
  <ul>
    <li><a href="#top" data-go="top" data-i18n="m1"></a></li>
    <li><a href="#how" data-go="how" data-i18n="m2"></a></li>
    <li><a href="#levels" data-go="levels" data-i18n="m3"></a></li>
    <li><a href="#faq" data-go="faq" data-i18n="m4"></a></li>
    <li><a href="#join" data-go="join" data-i18n="m5"></a></li>
  </ul>
</nav>

<main>
  <section class="hero" id="top" data-scene="hero" data-i18n-aria="heroA">
    <div class="hero-intro" data-i18n="heroIntro"></div>
    <div class="hero-ui" id="heroUi">
      <div class="hero-row">
        <button class="arrow" id="prev" type="button" data-i18n-aria="prevA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="hero-name" aria-live="polite">
          <span class="eyebrow" id="heroCount"></span>
          <h1 id="heroName"></h1>
        </div>
        <button class="arrow" id="next" type="button" data-i18n-aria="nextA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="track" aria-hidden="true"><span class="thumb" id="thumb"></span></div>
    </div>
    <p class="hint" data-i18n="hint"></p>
  </section>

  <section class="scene" id="direction" data-scene="intro">
    <div class="inner">
      <div class="panel">
        <p class="eyebrow"><span class="dot"></span><span id="introIdx"></span></p>
        <h2 class="big" id="introName"></h2>
        <p class="lead" id="introDesc"></p>
        <ul class="chips" id="introChips"></ul>
      </div>
    </div>
  </section>

  <section class="scene" id="how" data-scene="f1">
    <div class="inner"><div class="panel">
      <p class="eyebrow"><span class="dot"></span><span data-i18n="f1e"></span></p>
      <h2 class="mid" data-i18n="f1t"></h2>
      <p class="lead" data-i18n="f1l"></p>
      <p class="stat" data-i18n="f1s"></p>
    </div></div>
  </section>

  <section class="scene" data-scene="f2">
    <div class="inner"><div class="panel">
      <p class="eyebrow"><span class="dot"></span><span data-i18n="f2e"></span></p>
      <h2 class="mid" data-i18n="f2t"></h2>
      <p class="lead" data-i18n="f2l"></p>
      <p class="stat" data-i18n="f2s"></p>
    </div></div>
  </section>

  <section class="scene" data-scene="f3">
    <div class="inner"><div class="panel">
      <p class="eyebrow"><span class="dot"></span><span data-i18n="f3e"></span></p>
      <h2 class="mid" data-i18n="f3t"></h2>
      <p class="lead" data-i18n="f3l"></p>
      <p class="stat" data-i18n="f3s"></p>
    </div></div>
  </section>

  <section class="slogan" data-scene="slogan" data-i18n-aria="sloganA">
    <h2 data-i18n="slogan"></h2>
    <p>Instagram · TikTok · YouTube · Telegram</p>
  </section>

  <section class="lineup" id="program" data-scene="lineup">
    <div class="lineup-head">
      <p class="eyebrow"><span class="dot"></span><span data-i18n="progE"></span></p>
      <h2 class="mid" data-i18n="progT"></h2>
    </div>
    <div id="labels"></div>
  </section>

  <section class="levels" id="levels" data-scene="away">
    <div class="inner">
      <p class="eyebrow"><span class="dot"></span><span data-i18n="lvE"></span></p>
      <h2 class="big" data-i18n="lvT"></h2>
      <div class="lv-grid">
        <article class="lv-card a">
          <header><h3>Master AI 3.0</h3><span class="tagline" data-i18n="lv3tag"></span></header>
          <ul data-i18n="lv3list"></ul>
        </article>
        <article class="lv-card b">
          <header><h3>Master AI 4.0</h3><span class="tagline" data-i18n="lv4tag"></span></header>
          <ul data-i18n="lv4list"></ul>
        </article>
      </div>
      <div class="soon" data-i18n="soon"></div>
    </div>
  </section>

  <section class="faq" id="faq" data-scene="away">
    <div class="inner">
      <h2 class="big" data-i18n="faqT"></h2>
      <div data-i18n="faqList"></div>
    </div>
  </section>

  <section class="join" id="join" data-scene="away">
    <div class="inner">
      <p class="eyebrow"><span class="dot"></span><span data-i18n="joinE"></span></p>
      <h2 class="big" data-i18n="joinT"></h2>
      <p class="lead" data-i18n="joinL"></p>

  switch(name){
    case 'hero': return heroT(i);
    case 'intro': return i===sel?T(narrow?0:3.1,narrow?2.35:.15,1,.06,-.32+Math.sin(tm*.5)*.12,-.16,narrow?.88:1.22,1):away(heroT(i),-10);
    case 'f1': case 'f2': case 'f3': {const j=+name[1];
      return i===sel?T(narrow?0:2.9,narrow?2.45:.05,1.5,.05,j*SPIN+[-.28,-.2,-.3][j-1]+Math.sin(tm*.6)*.05,[-.12,.06,-.08][j-1],narrow?.92:1.3,1):away(heroT(i),-10);}
    case 'slogan': return i===sel?T(0,narrow?.3:.1,2.2,.05,4*SPIN+Math.sin(tm*.7)*.35,.1,narrow?.8:1.15,1):away(heroT(i),-10);
    case 'lineup': {const t=lineT(i); if(i===sel) t.ry+=4*SPIN; return t;}
    default: {const t=away(lineT(i),12); if(i===sel) t.ry+=4*SPIN; return t;}
  }
}
const GLOW={hero:.85,intro:.95,f1:1,f2:1,f3:1,slogan:1.25,lineup:.4,away:.1};

const v3=new THREE.Vector3();
function toScreen(x,y,z){v3.set(x,y,z).project(camera);return [(v3.x*.5+.5)*innerWidth,(-v3.y*.5+.5)*innerHeight];}
const pedY=()=>HERO.y-PH/2*HERO.s-.06-.21;
const lampY=()=>HERO.y+PH/2*HERO.s+.45;

function resize(){
  const w=innerWidth,h=innerHeight; narrow=w/h<0.9;
  renderer.setSize(w,h,false); camera.aspect=w/h;
  const th=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const z=narrow?Math.max(13/(2*th),7/(2*th*camera.aspect)):Math.max(10.6/(2*th),19.5/(2*th*camera.aspect));
  camera.position.set(0,0,z); camera.lookAt(0,0,0); camera.updateProjectionMatrix();
  $('#program').style.height=h+'px';
  measure(); placeOverlays();
}
function placeOverlays(){
  const ui=$('#heroUi'); const [,py]=toScreen(0,pedY()-.21,.6+1.9);
  ui.style.top=Math.max(innerHeight*.55,Math.min(py+18,innerHeight-ui.offsetHeight-58))+'px';
  labels.forEach((l,i)=>{const t=lineT(i);const [lx,ly]=toScreen(t.x,t.y-PH/2*t.s-.1,t.z);l.style.left=lx+'px';l.style.top=ly+'px';});
}

const hero=$('#top'); let px=null, moved=false;
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
hero.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;px=e.clientX;moved=false;});
addEventListener('pointermove',e=>{if(px===null)return;const dx=e.clientX-px;if(Math.abs(dx)>50){go(dx<0?1:-1);px=e.clientX;moved=true;}});
addEventListener('pointerup',e=>{
  if(px!==null&&!moved&&e.target.closest&&e.target.closest('#top')&&!e.target.closest('button')){
    ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
    const hit=ray.intersectObjects(phones.map(p=>p.grp),true).find(h=>h.object.parent.visible);
    if(hit&&hit.object.userData.idx!==sel) goTo(hit.object.userData.idx);
  }
  px=null;
});
addEventListener('pointercancel',()=>{px=null;});

const colNow=hexRgb(BASE[0].color), tmpCol=new THREE.Color();
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; tm=RM?0:now/1000;
  cur+=(target-cur)*(1-Math.exp(-dt*(RM?40:7)));
  thumb.style.left=(mod(cur+.5,N)-.5)/N*100+'%';
  const [ia,ib,w]=blend(scrollY), na=names[ia], nb=names[ib];
  const k=1-Math.exp(-dt*(RM?40:10));
  phones.forEach((p,i)=>{
    const A=sceneT(na,i),B=sceneT(nb,i),g={};
    for(const q in A) g[q]=mix(A[q],B[q],w);
    let s=p.state;
    if(!s||Math.abs(g.x-s.x)>6){p.state=s={...g};} else for(const q in g) s[q]+=(g[q]-s[q])*k;
    if(i!==sel && Math.abs(s.ry)>TAU){s.ry=mod(s.ry+Math.PI,TAU)-Math.PI;}
    p.grp.position.set(s.x,s.y,s.z); p.grp.rotation.set(s.rx,s.ry,s.rz); p.grp.scale.setScalar(Math.max(.001,s.s));
    p.mats.forEach(m=>m.opacity=s.o); p.grp.visible=s.o>.01;
    // which screen: own reel, or one of the three "how we learn" screens
    const turn=Math.round(s.ry/TAU), want=(i===sel&&turn>=1&&turn<=3)?featureTex[turn-1]:p.own;
    if(p.shown!==want){p.screenM.map=want;p.screenM.emissiveMap=want;p.shown=want;}
  });
  const hw=(na==='hero'?1-w:0)+(nb==='hero'?w:0);
  ped.position.set(0,pedY()-(1-hw)*5,.6); lamp.position.set(0,lampY()+(1-hw)*5,.6);
  pedMats.forEach(m=>m.opacity=hw); ped.visible=lamp.visible=hw>.01;
  const tc=hexRgb(BASE[sel].color), kc=1-Math.exp(-dt*4);
  for(let j=0;j<3;j++) colNow[j]+=(tc[j]-colNow[j])*kc;
  setRGB(colNow); tmpCol.setRGB(colNow[0]/255,colNow[1]/255,colNow[2]/255);
  rimL.color.copy(tmpCol); rimR.color.copy(tmpCol); ped.userData.ring.color.copy(tmpCol);
  const sc=phones[sel]&&phones[sel].state;
  if(sc){const [gx,gy]=toScreen(sc.x,sc.y,sc.z);root.style.setProperty('--gx',(gx/innerWidth*100).toFixed(2)+'%');root.style.setProperty('--gy',(gy/innerHeight*100).toFixed(2)+'%');}
  root.style.setProperty('--glow',mix(GLOW[na] ?? 0.1,GLOW[nb] ?? 0.1,w).toFixed(3));
  root.style.setProperty('--beams',mix(na==='slogan'?1:0,nb==='slogan'?1:0,w).toFixed(3));
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
function start(){
  buildPhones();
  retex=function(){featureTex.forEach(t=>t.dispose());featureTex.length=0;drawFeatures();phones.forEach((p,i)=>{p.own.dispose();p.own=drawReel(D(i));p.shown=null;});}; resize(); renderUI();
  addEventListener('resize',resize);
  if('ResizeObserver' in window) new ResizeObserver(()=>measure()).observe(document.body);
  requestAnimationFrame(t=>{last=t;frame(t);$('#gl').classList.add('ready');});
}
const fontsReady=document.fonts?Promise.all([
  document.fonts.load('800 100px Unbounded','ИИ ВИДЕО gulhayo.ai'),
  document.fonts.load('700 30px Onest','Подписаться Reels'),
  document.fonts.load('500 30px Onest','Сообщение қандай ёзилади Ҳафта ўғ'),
  document.fonts.load('800 100px Unbounded','ЎЗ САЙТИНГИЗ ШАХСИЙ'),
  document.fonts.load('600 30px Onest','9:41 Слайд')
]).catch(()=>{}):Promise.resolve();
renderUI();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,2500))]).then(start);
})();
</script>
